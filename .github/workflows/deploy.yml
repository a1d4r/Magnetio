name: Validate And Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            addon/package-lock.json
            scraper/package-lock.json

      - name: Install addon dependencies
        working-directory: addon
        run: npm install --ignore-scripts=false

      - name: Test addon
        working-directory: addon
        run: npm test

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci

      - name: Test scraper
        working-directory: scraper
        run: npm test

  deploy:
    name: deploy
    needs: validate
    if: >-
      github.actor == 'peterdsp' &&
      (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, raspberry-pi, production]
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify production runner
        run: |
          set -euo pipefail

          test "${RUNNER_ENVIRONMENT:-}" = "self-hosted"
          command -v rsync
          command -v node
          command -v npm

      - name: Sync repository to local deploy path
        env:
          DEPLOY_PATH: /home/peterdsp/magnetio-recovery
        run: |
          set -euo pipefail

          if [ "$DEPLOY_PATH" != "/home/peterdsp/magnetio-recovery" ]; then
            echo "Unexpected DEPLOY_PATH: $DEPLOY_PATH"
            exit 1
          fi

          mkdir -p "$DEPLOY_PATH"

          rsync -az --delete \
            --filter='P .env' \
            --filter='P addon/.env' \
            --filter='P scraper/.env' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'addon/node_modules/' \
            --exclude 'scraper/node_modules/' \
            --exclude '.DS_Store' \
            ./ "$DEPLOY_PATH/"

          printf '%s\n' "$GITHUB_SHA" > "$DEPLOY_PATH/addon/.deployment-revision"
          printf '%s\n' "$GITHUB_SHA" > "$DEPLOY_PATH/scraper/.deployment-revision"

      - name: Deploy with available storage
        env:
          DEPLOY_PATH: /home/peterdsp/magnetio-recovery
          DEPLOY_MODE: native
        run: |
          set -euo pipefail
          "$DEPLOY_PATH/scripts/deploy-production.sh"

      - name: Verify deployed source and running revision
        env:
          DEPLOY_PATH: /home/peterdsp/magnetio-recovery
        run: |
          set -euo pipefail
          git ls-files -z -- '*.js' '*.mjs' 'addon/package.json' 'scraper/package.json' 'deploy/systemd/*' 'scripts/*' |
            while IFS= read -r -d '' path; do
              cmp "$path" "$DEPLOY_PATH/$path"
            done
          systemctl is-active magnetio-addon.service magnetio-scraper.service
          systemctl show magnetio-addon.service magnetio-scraper.service \
            -p MainPID -p ExecMainStartTimestamp -p WorkingDirectory
          node --input-type=module <<'NODE'
          for (const port of [7000, 8080]) {
            const response = await fetch(`http://127.0.0.1:${port}/health`);
            const data = await response.json();
            if (!response.ok || data.status !== 'ok' || data.revision !== process.env.GITHUB_SHA) {
              throw new Error(`Wrong running release on port ${port}: ${JSON.stringify(data)}`);
            }
            console.log(JSON.stringify(data));
          }
          NODE

      - name: Health check
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTHCHECK_URL:-}" ]; then
            echo "HEALTHCHECK_URL not set; skipping."
            exit 0
          fi

          curl --fail --retry 12 --retry-delay 5 --retry-connrefused "$HEALTHCHECK_URL"
